description: Umpqua Holdings (now part of Columbia Banking System) is a regulated US bank holding company.
  Banking integrations are governed by treasury-management agreements, business-banking contracts, and
  regulator-mandated open-banking / data-sharing terms. There is no public developer portal or published
  API price sheet.
notes: umpquabank.com fetch returned 403; no public developer portal could be located. Banking integrations
  are contract-only. Trimmed to a single Contact Sales plan.
sources:
  - https://www.umpquabank.com/
plans:
  - id: umpqua-holdings-contact-sales
    name: Contact Sales (Treasury / Business Banking)
    type: enterprise
    description: All Umpqua / Columbia Banking integration access is contract-driven via treasury management
      and business banking agreements. Pricing reflects banking-product fees rather than per-API charges.
    entries:
      - label: Custom Contract
        name: custom_contract
        type: flat
        metric: varies
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Treasury Management Integration
      - name: Business Banking Connectivity
      - name: Regulated Data Sharing (Open Banking / Aggregator)
      - name: Custom Contract
